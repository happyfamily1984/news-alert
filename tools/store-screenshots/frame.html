<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;
 background:linear-gradient(160deg,#5B8DEF 0%,#2563EB 55%,#1D4ED8 100%);position:relative}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
h1{position:absolute;top:120px;left:0;right:0;margin:0;text-align:center;color:#fff;font-weight:800;font-size:76px;line-height:1.3;letter-spacing:-1px}
.shot{position:absolute;left:50%;top:430px;transform:translateX(-50%);width:820px;height:1458px;border-radius:56px;overflow:hidden;
 box-shadow:0 30px 80px rgba(10,30,90,.45);border:14px solid #0F1B3D;background:#fff}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<div class="blob" style="width:700px;height:700px;left:-260px;top:-200px"></div>
<div class="blob" style="width:520px;height:520px;right:-180px;top:900px"></div>
<h1 id="t"></h1><div class="shot"><img id="i"></div>
<script>const p=new URLSearchParams(location.search);document.getElementById('t').innerHTML=p.get('t');document.getElementById('i').src=p.get('i');</script>
</body></html>
