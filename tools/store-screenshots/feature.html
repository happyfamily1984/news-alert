<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&display=block" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1024px;height:500px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;position:relative;
 background:linear-gradient(135deg,#5B8DEF 0%,#2563EB 60%,#1D4ED8 100%)}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.icon{position:absolute;left:72px;top:150px;width:200px;height:200px;border-radius:46px;box-shadow:0 18px 40px rgba(10,30,90,.35)}
.t{position:absolute;left:310px;top:150px;color:#fff;font-weight:800;font-size:64px;letter-spacing:-1px}
.s{position:absolute;left:312px;top:250px;color:#E0E9FF;font-weight:500;font-size:30px;line-height:1.5}
.phone{position:absolute;right:40px;top:60px;width:230px;height:470px;border-radius:30px;border:8px solid #0F1B3D;overflow:hidden;
 box-shadow:0 20px 50px rgba(10,30,90,.45);transform:rotate(6deg)}
.phone img{width:100%}
</style></head><body>
<div class="blob" style="width:520px;height:520px;left:-200px;top:-260px"></div>
<div class="blob" style="width:380px;height:380px;left:420px;top:300px"></div>
<img class="icon" src="icon.png">
<div class="t">뉴스 알리미</div>
<div class="s">관심 키워드 뉴스가 올라오면<br>바로 알려드려요</div>
<div class="phone"><img src="s_home.png"></div>
</body></html>
