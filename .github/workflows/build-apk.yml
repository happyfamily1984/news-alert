name: Build APK

# 직접 설치용 APK(공개 테스트 키 서명)는 항상 만들고,
# 플레이스토어용 AAB는 업로드 키 시크릿(UPLOAD_KEYSTORE_BASE64 등)이
# 등록돼 있을 때만 업로드 키로 서명해서 만든다.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.32.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      # gradle-wrapper.jar는 바이너리라 저장소에 넣지 않고 CI에서 받는다.
      - name: Prepare Gradle wrapper jar
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # 오류·경고가 있으면 빌드를 멈춘다 (안내 수준은 통과).
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-alarm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build Play Store AAB (upload key)
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        env:
          NEWSALARM_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          NEWSALARM_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          NEWSALARM_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"
          export NEWSALARM_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload-keystore.p12"
          flutter build appbundle --release
          rm -f "$RUNNER_TEMP/upload-keystore.p12"

      - name: Upload AAB artifact
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: news-alarm-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
